<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>TIKTOK WAR — LIVE</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="live">
<header class="topbar">
  <div>
    <div class="brand">⚔️ TIKTOK WAR</div>
    <div id="season">THE GREAT WAR</div>
  </div>
  <div id="connection" class="pill">OFFLINE</div>
</header>

<main>
  <section class="battle-card">
    <div class="map-title">
      <span>WORLD MAP</span>
      <span id="clock"></span>
    </div>
    <div id="map" class="map"></div>
  </section>

  <section class="story-card">
    <div class="story-header">
      <b>📜 CHRONIQUE DE LA GUERRE</b>
      <span id="eventCounter"></span>
    </div>
    <div id="story" class="story"></div>
  </section>

  <section class="leader-card">
    <div class="story-header"><b>👑 ROYAUMES</b></div>
    <div id="leaders"></div>
  </section>
</main>

<script src="/live.js"></script>
</body>
</html>
