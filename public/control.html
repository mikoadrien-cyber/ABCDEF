<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>TIKTOK WAR — CONTROL</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="control">
<header class="topbar">
  <div>
    <div class="brand">🎮 WAR CONTROL</div>
    <div>Maître du jeu</div>
  </div>
  <div id="status" class="pill">READY</div>
</header>

<main class="control-grid">
  <section class="panel">
    <h2>🔐 Connexion</h2>
    <input id="token" type="password" placeholder="ADMIN_TOKEN">
    <button onclick="saveToken()">Enregistrer</button>
  </section>

  <section class="panel">
    <h2>👥 Ajouter un royaume</h2>
    <input id="playerId" placeholder="ID (ex: miko)">
    <input id="playerName" placeholder="Pseudo TikTok">
    <button onclick="addPlayer()">Ajouter</button>
    <div id="players" class="players"></div>
  </section>

  <section class="panel">
    <h2>🎁 Simulateur de cadeaux</h2>
    <select id="giftActor"></select>
    <input id="coins" type="number" value="100" min="1">
    <input id="giftName" value="Cadeau LIVE">
    <button onclick="gift()">Déclencher le cadeau</button>
  </section>

  <section class="panel">
    <h2>🎭 Événements</h2>
    <select id="actor"></select>
    <select id="target"></select>
    <div class="event-buttons">
      <button onclick="event('SCOUT')">🕵️ Éclaireur</button>
      <button onclick="event('REINFORCEMENT')">🪖 Renfort</button>
      <button onclick="event('INVASION')">⚔️ Invasion</button>
      <button onclick="event('ESPIONAGE')">👁️ Espionnage</button>
      <button onclick="event('SABOTAGE')">💣 Sabotage</button>
      <button onclick="event('HERO')">👑 Héros</button>
      <button onclick="event('SHIELD')">🛡️ Bouclier</button>
      <button onclick="event('ALLIANCE')">🤝 Alliance</button>
      <button onclick="event('BETRAYAL')">☠️ Trahison</button>
      <button onclick="event('CATASTROPHE')">🌋 Catastrophe</button>
      <button onclick="event('WAR')">🔥 Guerre totale</button>
    </div>
  </section>

  <section class="panel">
    <h2>🤝 Diplomatie</h2>
    <button onclick="alliance('create')">Créer alliance</button>
    <button onclick="alliance('break')">💔 Rompre alliance</button>
  </section>

  <section class="panel danger">
    <h2>☢️ Saison</h2>
    <button onclick="resetGame()">Nouvelle guerre</button>
  </section>

  <section class="panel full">
    <h2>📜 Timeline</h2>
    <div id="timeline" class="timeline"></div>
  </section>
</main>

<script src="/control.js"></script>
</body>
</html>
